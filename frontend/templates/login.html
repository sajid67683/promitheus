{% extends "base.html" %}

{% block content %}
{% if google_client_id %}<script src="https://accounts.google.com/gsi/client" async defer></script>{% endif %}

<div
    class="max-w-md mx-auto mt-20 bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 transition-colors duration-300">
    <h2 id="auth-title" class="text-3xl font-extrabold text-center text-slate-800 dark:text-white mb-8">Welcome Back
    </h2>

    <div class="space-y-4">
        <input type="text" id="username" placeholder="Username or email" autocomplete="username"
            class="w-full p-4 border-2 border-slate-100 dark:border-slate-800 rounded-2xl outline-none focus:border-indigo-500 dark:focus:border-indigo-400 bg-white dark:bg-slate-800 text-slate-800 dark:text-white transition">

        <input type="email" id="email" placeholder="Email" autocomplete="email"
            class="w-full p-4 border-2 border-slate-100 dark:border-slate-800 rounded-2xl outline-none focus:border-indigo-500 dark:focus:border-indigo-400 bg-white dark:bg-slate-800 text-slate-800 dark:text-white transition hidden">

        <input type="password" id="password" placeholder="Password" autocomplete="current-password"
            class="w-full p-4 border-2 border-slate-100 dark:border-slate-800 rounded-2xl outline-none focus:border-indigo-500 dark:focus:border-indigo-400 bg-white dark:bg-slate-800 text-slate-800 dark:text-white transition">

        <button onclick="handleAuth()" id="auth-btn"
            class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200 dark:shadow-none hover:bg-indigo-700 transition transform active:scale-[0.98]">
            Login
        </button>

        {% if google_client_id %}
        <div class="mt-6 flex flex-col items-center gap-4 border-t-2 border-slate-100 dark:border-slate-800 pt-6">
            <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Or</p>

            <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-context="signin" data-ux_mode="popup"
                data-callback="handleGoogleLogin" data-auto_prompt="false">
            </div>

            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="continue_with" data-size="large" data-logo_alignment="left">
            </div>
        </div>
        {% endif %}
        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
            <span id="toggle-text">Don't have an account?</span>
            <button onclick="toggleAuthMode()" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">
                Click here
            </button>
        </p>
    </div>
</div>
{% endblock %}
