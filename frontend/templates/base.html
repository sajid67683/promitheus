<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Promitheus{% endblock %}</title>
  <meta name="description" content="{% block description %}Turn lecture notes into bite-sized quizzes and build a daily study habit.{% endblock %}">
  <meta name="theme-color" content="#f5f8f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1614" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css?v={{ settings.asset_version }}">
  <script>
    // Apply the saved theme before first paint (no light/dark flash).
    (function () {
      var pref = "system";
      try { pref = localStorage.getItem("promitheus:theme") || "system"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-dvh bg-paper text-ink {% block body_class %}{% endblock %}">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100] btn btn-primary btn-sm">Skip to content</a>
  {% block body %}{% endblock %}
  <div id="toasts" class="fixed z-[90] inset-x-0 top-[4.75rem] sm:top-[5.5rem] flex flex-col items-center gap-2 px-4 pointer-events-none" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="/static/js/app.js?v={{ settings.asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
