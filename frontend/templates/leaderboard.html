{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center w-full max-w-[600px] mx-auto pb-20">

    <div class="text-center mb-10 mt-6">
        <div class="relative inline-block">
            <span id="league-emoji" class="text-9xl drop-shadow-2xl">🥉</span>
            <div
                class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-white dark:bg-[#131f24] border-2 border-slate-200 dark:border-slate-700 px-4 py-1 rounded-full shadow-lg">
                <span id="current-league-display"
                    class="font-black text-orange-600 tracking-widest text-sm uppercase">Loading...</span>
            </div>
        </div>
        <p class="text-slate-500 dark:text-slate-400 font-bold mt-8">Compete with other students to climb the ranks!</p>
    </div>

    <div id="leaderboard-list"
        class="w-full border-2 border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden bg-white dark:bg-[#0b141a]">
        <div class="p-10 text-center text-slate-400 font-bold">
            Gathering competitors...
        </div>
    </div>

    <div class="mt-8 p-6 bg-blue-500/10 border-2 border-blue-500/20 rounded-2xl w-full text-center">
        <p class="text-blue-500 font-bold text-sm">Top 10 users promote to Silver League next week! 🚀</p>
    </div>
</div>
{% endblock %}
